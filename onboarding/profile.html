<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Profile | Tug of Love</title>

  <!-- Global + Onboarding Styles -->
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/onboarding.css" />
</head>

<body>

  <div class="preferences-page">

    <div class="pref-center">

      <div class="pref-ticket">

        <div class="pref-content">

          <h1 class="pref-title">
            Let’s get to know<br>you 💛
          </h1>
          <p class="pref-sub">Just the basics — we’ll take it slow.</p>

          <form id="profileForm" class="pref-form">

            <input type="text" id="name" class="pref-input" placeholder="Your name" required>

            <input type="tel" id="phone" class="pref-input" placeholder="Phone number" required>

            <select id="gender" class="pref-input" required>
              <option value="">Gender identity</option>
              <option>Man</option>
              <option>Woman</option>
              <option>Non-binary</option>
              <option>Prefer to self-describe</option>
            </select>

          </form>

        </div>

        <button type="submit" form="profileForm" class="pref-btn">
          Continue 💘
        </button>

      </div>

    </div>

  </div>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/profile.js"></script>

</body>

</html>
