<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Profile | Tug of Love</title>

  <!-- Global + Onboarding Styles -->
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/onboarding.css" />
</head>

<body>

  <div class="preferences-page">

    <div class="pref-center">

      <div class="pref-ticket">

      <!-- Ticket SVG -->
      <img src="../assets/images/ticket.svg" class="ticket-bg" />

      <!-- Content inside ticket -->
      <div class="ticket-content">

        <form id="profileForm" class="pref-form">

          <input type="text" id="name" class="pref-input" placeholder="Your name" required>

          <input type="tel" id="phone" class="pref-input" placeholder="Phone number" required>

          <select id="gender" required>
            <option value="">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="non-binary">Non-binary</option>
          </select>

          <select id="orientation" required>
            <option value="">Select Orientation</option>
            <option value="straight">Straight</option>
            <option value="gay">Gay</option>
            <option value="lesbian">Lesbian</option>
            <option value="bisex">Bisexual</option>
            <option value="other">Other</option>
          </select>

        </form>

      </div>

      <!-- Bottom image button -->
      <img src="../assets/images/continue-btn.png"
          id="continueBtn"
          class="ticket-bottom-btn" />

    </div>


    </div>

  </div>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/profile.js"></script>

</body>

</html>
