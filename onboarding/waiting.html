<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Emoji | Tug of Love</title>
  <link rel="stylesheet" href="../assets/css/waiting.css" />
</head>

<body>

  <!-- Background handled in CSS -->

  <div class="waiting-container">

  <div class="ticket">

    <!-- Same ticket SVG used everywhere -->
    <img src="../assets/images/ticketp.svg" class="ticket-img" />

    <div class="ticket-content">

      <h2 class="ticket-title">Your Emoji</h2>

      <!-- Clickable Emoji -->
      <button id="emojiBtn" class="emoji-btn">
        <span id="emojiDisplay">💠</span>
      </button>

      <p class="ticket-sub">Tap your emoji ✨</p>

    </div>

    <!-- Bottom image button -->
    <a href="https://sortmyscene.com/event/tug-of-love-feb-14-2026"
       target="_blank"
       class="ticket-bottom-btn">
      <img src="../assets/images/waiting_btn.svg" alt="Book Now">
    </a>

  </div>

</div>


  </div>

  <!-- POPUP CARD -->
  <div id="overlay" class="overlay hidden">
  <div class="popup-card">

    <h3>What Happens Next 💌</h3>

    <p>
      Your match will be revealed shortly via email.
    </p>

    <p>
      Come meet them at<br>
      <strong>
        <a href="https://www.google.com/maps/place/Raasta+Bombay+Khar/"
           target="_blank">
           Raasta Bombay, Khar
        </a>
      </strong>
      <br>
      14th Feb · 7 PM
    </p>

    <button id="closePopup">Close</button>

  </div>
</div>


<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase.js"></script>
<script src="../assets/js/waiting.js"></script>

</body>
</html>
