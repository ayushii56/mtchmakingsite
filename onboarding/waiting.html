<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Emoji | Tug of Love</title>
  <link rel="stylesheet" href="../assets/css/waiting.css" />
</head>

<body>

  <!-- Background handled in CSS -->

  <div class="waiting-container">

    <div class="ticket">

      <img src="../assets/images/ticketp.png" class="ticket-img" />

      <div class="ticket-content">

        <p class="ticket-title">Your emoji is</p>

        <button id="emojiBtn" class="emoji-btn">
          <span id="emojiDisplay">💠</span>
        </button>

        <p class="ticket-sub">
          Tap your emoji ✨
        </p>

        <!-- Link image button -->
        <a href="https://sortmyscene.com/event/tug-of-love-feb-14-2026"
           target="_blank"
           class="link-button">
           <img src="../assets/images/link.png" alt="Buy Ticket">
        </a>

      </div>

    </div>

  </div>

  <!-- POPUP CARD -->
  <div id="overlay" class="overlay hidden">
    <div class="popup-card">
      <h3>All good things come slow 💌</h3>
      <p>
        Your match will be revealed via email
        before the event.
      </p>
      <button id="closePopup">Close</button>
    </div>
  </div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase.js"></script>
<script src="../assets/js/waiting.js"></script>

</body>
</html>
