<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tug of Love 💖</title>
  <link rel="stylesheet" href="../assets/css/waiting.css" />
</head>

<body>

  <div class="stage">
    <div class="ticket-wrapper">

      <picture class="ticket-img">
        <source media="(max-width: 700px)" srcset="../assets/images/ticketp.png">
        <img src="../assets/images/ticket2.png" alt="ticket">
      </picture>

      <div class="ticket-text split">

        <!-- LEFT SIDE -->
        <div class="ticket-left">

          <p class="ticket-title">Your match emoji is</p>

          <div id="emojiDisplay" class="ticket-emoji">💠</div>

          <p id="statusMessage" class="ticket-desc">
            This is your identity for the event.<br>
            Your match will look for this emoji ✨
          </p>

        </div>

        <!-- RIGHT SIDE — booking -->
        <div class="ticket-right" id="bookingSection">

          <h3>Enter your ticket number</h3>

          <form id="bookingForm">
            <input id="bookingCode" type="text" placeholder="TOL001">
            <button type="submit">Submit</button>
          </form>

          <a class="ticket-link"
            href="https://sortmyscene.com/event/tug-of-love-feb-14-2026"
            target="_blank">
            Didn’t buy the ticket yet?
          </a>

        </div>

      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/waiting.js"></script>
  <script src="../assets/js/booking.js"></script>

</body>
</html>
