<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Questions | Tug of Love</title>

  <!-- Global Styles -->
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/onboarding.css" />
  <link rel="stylesheet" href="../assets/css/questions.css" />
</head>

<body>

  <div class="onboarding-container">

    <h1 class="question-title">
      Just a few questions 💭
    </h1>

    <p class="question-subtitle">
      Answer honestly — there’s no right or wrong here.
    </p>

    <!-- SLOT FRAME -->
    <div class="question-frame">

      <!-- QUESTION CARD -->
      <div class="question-card">

        <img src="../assets/images/arrow.png" id="arrowUp" class="arrow left">

        <div class="question-content">

          <p id="progressText" class="question-progress">
            Question 1 of 21
          </p>

          <h2 id="questionText" class="question-text">
            I would pick a chill night-in over a chaotic night-out.
          </h2>

          <div class="question-actions">

            <label>
              agree
              <input type="radio" name="answer" id="agreeBtn">
            </label>

            <label>
              disagree
              <input type="radio" name="answer" id="disagreeBtn">
            </label>

          </div>

        </div>

        <img src="../assets/images/arrow.png" id="arrowDown" class="arrow right">

      </div>


      <!-- JS (UNCHANGED) -->
      <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
      <script src="../assets/js/supabase.js"></script>
      <script src="../assets/js/questions.js"></script>

</body>

</html>
