<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Preferences | Tug of Love</title>

  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/preferences.css">
</head>

<body class="preferences-page">

  <div class="pref-center">

    <div class="pref-ticket">

      <div class="pref-content">

        <h1 class="pref-title">Your <br>Preferences 💛</h1>

    

        <form id="preferencesForm" class="pref-form">

          <select class="pref-input">
            <option>Select sexual orientation</option>
            <option>Straight</option>
            <option>Gay</option>
            <option>Lesbian</option>
            <option>Bisexual</option>
          </select>

          <label class="form-label">I am attracted to</label>

          <div id="attractedGenders" class="pref-pill-group">

            <div class="pref-pill" data-value="Man">Man</div>
            <div class="pref-pill" data-value="Woman">Woman</div>
            <div class="pref-pill" data-value="Non-binary">Non-binary</div>

          </div>

          <input type="hidden" id="attractedInput" name="attracted">
          <p>(you can select multiple options)</p>


          <select class="pref-input">
            <option>Open to different orientations?</option>
            <option>Yes</option>
            <option>No</option>
          </select>

        </form>

      </div>

      <button form="preferencesForm" class="pref-btn">
        Continue 💘
      </button>

    </div>

  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/preferences.js"></script>
</body>

</html>
