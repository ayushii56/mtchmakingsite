<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Email | Tug of Love</title>

  <!-- Global + Auth Styles -->
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/auth.css" />
</head>
<body>

  <div class="auth-container">
    <h1 class="auth-title">Almost there 💌</h1>
    <p class="auth-subtitle">
      We’ve sent a verification link to your email.
    </p>

    <div class="auth-card">
      <p style="text-align: center; color: #7a1f2b; line-height: 1.6;">
        Please check your inbox and click the link to continue.
        <br /><br />
        Once verified, you’ll be redirected automatically to
        continue your Tug of Love journey 💖
      </p>
    </div>

    <p class="auth-footer">
      Didn’t receive the email? Check spam or try again 🌹
    </p>
  </div>

  <!-- JS -->
  <script src="../assets/js/verify.js"></script>
</body>
</html>
